name: hmis
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.10.1

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  android_intent_plus: ^6.0.0
  cloud_firestore: ^6.1.0
  connectivity_plus: ^7.0.0
  cupertino_icons: ^1.0.8
  device_info_plus: ^12.4.0
  dio: ^5.9.0
  easy_localization: ^3.0.8
  file_picker: ^11.0.2
  firebase_auth: ^6.1.2
  firebase_core: ^4.2.1
  firebase_messaging: ^16.0.4
  flutter:
    sdk: flutter
  flutter_image_compress: ^2.4.0
  flutter_local_notifications: ^21.0.0
  flutter_localizations:
    sdk: flutter
  flutter_native_timezone_latest: ^1.0.0
  flutter_riverpod: ^3.0.3
  flutter_svg: ^2.2.3
  go_router: ^17.0.0
  google_sign_in: ^7.2.0
  googleapis_auth: ^2.0.0
  hive_flutter: ^1.1.0
  image_picker: ^1.2.1
  intl: ^0.20.2
  path_provider: ^2.1.2
  permission_handler: ^12.0.1
  rename_app: ^1.6.5
  responsive_framework: ^1.5.1
  riverpod_annotation: ^4.0.2
  skeletonizer: ^2.1.1
  supabase_flutter: ^2.9.0
  timezone: ^0.11.0
  url_launcher: ^6.3.2
  uuid: ^4.5.2

dev_dependencies:
  build_runner: ^2.7.1
  flutter_gen_runner: ^5.12.0
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  riverpod_generator: ^4.0.3
flutter:

  uses-material-design: true
  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/png/
    - assets/images/svg/
  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images
  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package
  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
  # TODO Change app icon run this comannd : dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/png/app-logo.png"
  image_path_ios: "assets/images/png/app-logo.png"
  background_color: "#FFFFFF"
  web:
    generate: true
    image_path: "assets/images/png/app-logo.png"
    background_color: "#FFFFFF"
    theme_color: "#FFFFFF"
  windows:
    generate: true
    image_path: "assets/images/png/app-logo.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/images/png/app-logo.png"

#if need to rename app use this command : dart run rename_app:main all="My App Name"
